  <meta name="description" content="In-depth case studies from Matthew Brown, a Melbourne-born, Seattle-based Product Designer.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="site-logo"><a href="index.html"><img src="assets/images/favicon/logo-mark.png" alt="" class="site-logo-mark">Matthew Brown</a></div>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Product Design</a></li>
          <li><a href="visual-design.html">Visual Design</a></li>
          <li><a href="case-studies.html" aria-current="page">Case Studies</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">

    <div class="password-gate" id="passwordGate">
      <div class="password-gate-card">
        <h1>This section is private</h1>
        <p class="tagline">Enter the password to view these case studies.</p>
        <form class="password-gate-form" id="passwordForm" autocomplete="off">
          <label for="passwordInput" class="sr-only">Password</label>
          <input type="password" id="passwordInput" name="password" placeholder="Password" autocomplete="current-password" required>
          <button type="submit">Unlock</button>
          <p class="password-gate-error" id="passwordError" role="alert"></p>
        </form>
      </div>
    </div>

    <div class="password-gate-content" id="gatedContent">
      <h1>Case Studies</h1>
      <p class="tagline">Detailed, in-depth write-ups are on the way — check back soon.</p>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Matthew Brown. <a href="https://www.linkedin.com/pub/matthew-brown/22/430/207">LinkedIn</a></p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script>
    (function () {
      // SHA-256 hash of the correct password — the plaintext password is never stored in this file.
      var PASSWORD_HASH = '6cba804ffe33a6adec8f8b9b8af0ffb436cdbed47757a23dc15ffd56050e7cab';
      var SESSION_KEY = 'caseStudiesUnlocked';

      var gate = document.getElementById('passwordGate');
      var content = document.getElementById('gatedContent');
      var form = document.getElementById('passwordForm');
      var input = document.getElementById('passwordInput');
      var error = document.getElementById('passwordError');

      function unlock() {
        gate.classList.add('is-unlocked');
        content.classList.add('is-unlocked');
      }

      function sha256(text) {
        var data = new TextEncoder().encode(text);
        return crypto.subtle.digest('SHA-256', data).then(function (buf) {
          return Array.prototype.map.call(new Uint8Array(buf), function (b) {
            return b.toString(16).padStart(2, '0');
          }).join('');
        });
      }

      // Stay unlocked for the rest of the browser session.
      if (sessionStorage.getItem(SESSION_KEY) === 'true') {
        unlock();
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        sha256(input.value).then(function (hash) {
          if (hash === PASSWORD_HASH) {
            sessionStorage.setItem(SESSION_KEY, 'true');
            error.textContent = '';
            input.classList.remove('is-error');
            unlock();
          } else {
            error.textContent = 'Incorrect password. Please try again.';
            input.classList.add('is-error');
            input.value = '';
            input.focus();
          }
        });
      });
    })();
  </script>
</body>
</html>
